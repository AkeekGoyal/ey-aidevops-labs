# The worker image is pre-built and shared by the trainer.
worker:
  image:
    repository: eylabacr31b021.azurecr.io/shared/shipwave-worker
    tag: "1.0"

api:
  replicaCount: 1
  image:
    repository: shipwave-api
    tag: "1.0"
    pullPolicy: IfNotPresent
  service:
    port: 8000
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
